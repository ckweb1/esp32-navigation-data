name: Update navigation data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build dataset
        shell: pwsh
        run: ./tools/Build-NavigationData.ps1

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Navigation data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json v1
          git commit -m "Update navigation data"
          git push
